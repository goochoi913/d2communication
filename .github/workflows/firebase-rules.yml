name: Firestore & Storage rules

# Tests the security rules against the Firebase emulators whenever they change, and
# deploys them (with the Firestore indexes) from main. Cloud Functions are deployed by
# hand with `npm run deploy:backend`, not from CI.
on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - storage.rules
      - firebase.json
      - tests/rules/**
      - vitest.config.mts
      - .github/workflows/firebase-rules.yml
  pull_request:
    paths:
      - firestore.rules
      - firestore.indexes.json
      - storage.rules
      - firebase.json
      - tests/rules/**
      - vitest.config.mts
      - .github/workflows/firebase-rules.yml

concurrency:
  group: firebase-rules-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # The Firestore and Storage emulators need Java 21 or newer.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Test the rules against the emulators
        run: npx --yes firebase-tools@15.34.0 emulators:exec --project demo-d2communication --only firestore,storage "npx vitest run tests/rules"

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Deploy the rules and indexes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@15.34.0 deploy --only firestore:rules,firestore:indexes,storage --project d2communication --non-interactive
